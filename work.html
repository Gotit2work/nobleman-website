<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work | Nobleman Productions</title>
<meta name="description" content="Selected films from Nobleman Productions: YouTube series, live broadcasts, conference recaps, marine and powersports.">
<link rel="canonical" href="https://noblemanproductions.gotit2work.com/work">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nobleman Productions">
<meta property="og:title" content="Work | Nobleman Productions">
<meta property="og:description" content="Selected films from Nobleman Productions: YouTube series, live broadcasts, conference recaps, marine and powersports.">
<meta property="og:url" content="https://noblemanproductions.gotit2work.com/work">
<meta property="og:image" content="https://noblemanproductions.gotit2work.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#031e25">
<style>html,body{margin:0;background:#fff}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;display=swap" media="print" onload="this.media='all'">
<script src="/vendor/react-18.3.1.production.min.js"></script>
<script src="/vendor/react-dom-18.3.1.production.min.js"></script>
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#ffffff;color:#0a0a0a;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:hover{color:inherit}
*{box-sizing:border-box}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
[data-reveal]{opacity:0;transform:translateY(28px);transition:opacity 1.2s cubic-bezier(.16,.84,.3,1),transform 1.2s cubic-bezier(.16,.84,.3,1)}
[data-reveal][data-in]{opacity:1;transform:none}
</style>
</helmet>
<div data-screen-label="Work" style="background:#fff;min-height:100vh;display:flex;flex-direction:column">

  <dc-import name="SiteChrome" theme="light" hint-size="100%,0px"></dc-import>

  <section style="max-width:1200px;width:100%;margin:0 auto;padding:150px 24px 40px;display:flex;flex-direction:column;gap:40px">
    <h1 style="margin:0;font-size:clamp(48px,7vw,120px);font-weight:500;letter-spacing:-0.01em;line-height:1.02">Work</h1>
    <div style="display:flex;gap:8px 28px;flex-wrap:wrap;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:16px 0">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button onClick="{{ f.select }}" style="background:none;border:0;padding:6px 0;font:inherit;font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;color:{{ f.color }};border-bottom:1px solid {{ f.border }}">{{ f.label }}</button>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1200px;width:100%;margin:0 auto;padding:0 24px 96px;flex:1">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px 32px">
      <sc-for list="{{ items }}" as="w" hint-placeholder-count="6">
        <a href="{{ w.href }}" style="display:flex;flex-direction:column;gap:16px;text-decoration:none;color:#0a0a0a">
          <sc-if value="{{ w.embed }}" hint-placeholder-val="{{ false }}">
            <div style="aspect-ratio:16/9;border-radius:32px;overflow:hidden;background:#031e25"><iframe src="{{ w.embed }}" title="{{ w.title }}" allow="fullscreen; picture-in-picture" style="width:100%;height:100%;border:0;display:block"></iframe></div>
          </sc-if>
          <sc-if value="{{ w.placeholder }}" hint-placeholder-val="{{ true }}">
            <div style="aspect-ratio:16/9;border-radius:32px;overflow:hidden;background:repeating-linear-gradient(135deg,#e5e7eb 0 10px,#eceef1 10px 20px);display:flex;align-items:center;justify-content:center"><span style="font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;text-align:center;padding:0 24px">{{ w.note }}</span></div>
          </sc-if>
          <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
            <span style="font-size:18px">{{ w.title }}</span>
            <span style="font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;white-space:nowrap">{{ w.meta }}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="background:#031e25;color:#f4f4f2;padding:96px 24px">
    <div style="max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:clamp(36px,5vw,72px);font-weight:500;letter-spacing:0.005em;line-height:1.12;max-width:720px;text-wrap:balance">Tell us about your project.</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a href="https://vimeo.com/noblemanproductions" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border:1px solid #fff;color:#fff;border-radius:32px;font-size:15px;font-weight:500;text-decoration:none;transition:background 150ms" style-hover="background:#fff;color:#0a0a0a">Full archive on Vimeo</a>
        <a href="/start" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;background:#fff;color:#0a0a0a;border-radius:32px;font-size:15px;font-weight:500;text-decoration:none;transition:background 150ms" style-hover="background:#f3f4f6;color:#0a0a0a">Start a Project</a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" above-bg="{{ footerAbove }}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: "All" };
  filters = ["All", "YouTube", "Live", "Events", "Marine", "Powersports"];
  work = [
    { title: "Nobleman Productions · Reel", tags: ["Marine", "Powersports", "Events"], meta: "Vimeo", href: "https://vimeo.com/1197058424/796798a19d", embed: "https://player.vimeo.com/video/1197058424?h=796798a19d&badge=0&title=0&byline=0&portrait=0" },
    { title: "Satellite Phone Store · Series", tags: ["YouTube"], meta: "28K views", href: "#", note: "youtube embed · satellite phone store" },
    { title: "Retro Boat · Channel", tags: ["YouTube", "Marine"], meta: "53 → 8,000 subs", href: "#", note: "youtube embed · retro boat episode" },
    { title: "MCT Exchange 2022 · Recap", tags: ["Events"], meta: "Events", href: "#", note: "vimeo embed · mct exchange recap" },
    { title: "Course launch · Live broadcast", tags: ["Live"], meta: "Live", href: "#", note: "vimeo embed · live production sample" },
    { title: "Nobleman Sailing Media · Offshore", tags: ["Marine", "YouTube"], meta: "YouTube", href: "#", note: "youtube embed · nobleman sailing media" },
    { title: "Powersports · Desert shoot", tags: ["Powersports"], meta: "Vimeo", href: "#", note: "vimeo embed · powersports" },
    { title: "Conference · Same-day highlights", tags: ["Events"], meta: "Events", href: "#", note: "vimeo embed · same-day highlight reel" },
  ];
  componentDidMount() {
    this.io = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) { e.target.setAttribute("data-in", ""); this.io.unobserve(e.target); } }); }, { threshold: 0.12 });
    const observe = () => document.querySelectorAll("[data-reveal]:not([data-in])").forEach(el => this.io.observe(el));
    observe(); this.mo = new MutationObserver(observe); this.mo.observe(document.body, { childList: true, subtree: true });
  }
  componentWillUnmount() { this.io && this.io.disconnect(); this.mo && this.mo.disconnect(); }
  renderVals() {
    const cur = this.state.filter;
    return {
      footerAbove: "#031e25",
      filters: this.filters.map(f => ({
        label: f,
        color: f === cur ? "#0a0a0a" : "rgba(10,10,10,0.5)",
        border: f === cur ? "#0a0a0a" : "transparent",
        select: () => this.setState({ filter: f }),
      })),
      items: this.work.filter(w => cur === "All" || w.tags.includes(cur)).map(w => ({ ...w, placeholder: !w.embed })),
    };
  }
}
</script>
<template id="__bundler_thumbnail" data-bg-color="#141414">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#141414"/>
    <text x="600" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="260" font-weight="700" fill="#f5f2ec">W</text>
  </svg>
</template>
</body>
</html>
